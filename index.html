<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Life</title>
<meta name="description" content="Raphael-DTZero 嘅專題合集 · Projects by Raphael-DTZero">
<meta name="author" content="Raphael-DTZero">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root{--bg:#F5F1E8;--surface:#FBF8F2;--fg:#1F1E1D;--muted:#6B6862;--line:#E3DCCC;--accent:#D97757;--accent-ink:#B0502C;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1C1A17;--surface:#25221E;--fg:#EFE9DF;--muted:#A79F93;--line:#3B362F;--accent:#E2876A;--accent-ink:#F0A086;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:28px}
.eyebrow{font:500 .82rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:clamp(2.2rem,1.6rem + 3vw,3.4rem);font-weight:900;line-height:1.1;margin:6px 0 0}
p{margin:0;color:var(--muted)}
.card{display:grid;gap:8px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--surface);transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h2{margin:0;font-size:1.4rem;font-weight:900}
.card .go{font-weight:700;color:var(--accent-ink)}
.langs{font:500 .8rem var(--mono);color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:18px;font-size:.85rem}
a{color:var(--accent-ink)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow">Raphael-DTZero</span>
    <h1>AI-Life</h1>
  </header>
  <p>專題合集 · Projects · プロジェクト集</p>
  <a class="card" href="not-an-npc/">
    <span class="eyebrow">not-an-npc</span>
    <h2>唔做 NPC 危機手冊</h2>
    <p>The Not-an-NPC Crisis Handbook · NPCにならない危機ハンドブック</p>
    <p>四種危機點準備、發生咗點做：AI 黑客與金融系統、天災、政局亂局、通脹與失業。</p>
    <span class="langs">粵 · EN · 日本語</span>
    <span class="go">打開 / Open / 開く →</span>
  </a>
  <footer>
    <p>© 2026 <a href="https://github.com/Raphael-DTZero">Raphael-DTZero</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · <a href="https://github.com/Raphael-DTZero/AI-Life">GitHub</a></p>
  </footer>
</main>
</body>
</html>
